[workspace]
resolver = "3"
members = [
  "apps/videogenerator",
  "crates/domain",
  "crates/engine-api",
  "crates/engine-host",
  "crates/engine-protocol",
  "crates/engine-process",
  "crates/jobs",
  "crates/model-manager",
  "crates/runtime-manager",
  "crates/ui-kit",
  "crates/ui-egui",
]
default-members = ["apps/videogenerator"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "persistence"] }
egui = "0.36.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

videogenerator-domain = { path = "crates/domain" }
videogenerator-engine-api = { path = "crates/engine-api" }
videogenerator-engine-host = { path = "crates/engine-host" }
videogenerator-engine-protocol = { path = "crates/engine-protocol" }
videogenerator-engine-process = { path = "crates/engine-process" }
videogenerator-jobs = { path = "crates/jobs" }
videogenerator-model-manager = { path = "crates/model-manager" }
videogenerator-runtime-manager = { path = "crates/runtime-manager" }
videogenerator-ui-kit = { path = "crates/ui-kit" }
videogenerator-ui-egui = { path = "crates/ui-egui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
